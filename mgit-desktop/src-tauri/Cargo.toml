[package]
name = "mgit-desktop"
version = "0.1.0"
description = "Cross-platform multi-repo git desktop GUI"
authors = ["mgit"]
edition = "2021"

[lib]
name = "mgit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
rayon = "1.10"
